<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moje MP3</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1f;--mut:#6b6b70;--line:#e3e1da;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#131316;--card:#1c1c21;--ink:#f1f0ec;--mut:#9a9aa3;--line:#2c2c33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:28px;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 10px}
audio{width:100%;height:40px;display:block}
.miss{color:var(--mut);font-size:14px;margin:0}
</style>
</head>
<body>
<main>
  <h1>Moje MP3</h1>
  <div id="list"></div>
</main>
<script>
// ===== NASTAVENIA: názvy skladieb a mená súborov =====
var TRACKS = [
  { title: "Skladba 1", file: "1.mp3" },
  { title: "Skladba 2", file: "2.mp3" },
  { title: "Skladba 3", file: "3.mp3" },
  { title: "Skladba 4", file: "4.mp3" },
  { title: "Skladba 5", file: "5.mp3" }
];
// =====================================================

var list = document.getElementById("list");
TRACKS.forEach(function (t) {
  var card = document.createElement("div");
  card.className = "card";
  var h = document.createElement("h2");
  h.textContent = t.title;
  var a = document.createElement("audio");
  a.controls = true;
  a.preload = "metadata";
  a.src = encodeURI(t.file);
  a.addEventListener("error", function () {
    var m = document.createElement("p");
    m.className = "miss";
    m.textContent = "Súbor „" + t.file + "“ ešte nie je nahraný.";
    a.replaceWith(m);
  });
  card.append(h, a);
  list.append(card);
});

// keď spustíš jednu skladbu, ostatné sa zastavia
document.addEventListener("play", function (e) {
  document.querySelectorAll("audio").forEach(function (a) {
    if (a !== e.target) a.pause();
  });
}, true);
</script>
</body>
</html>
